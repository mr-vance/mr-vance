name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure assets folder exists
        run: mkdir -p assets

      - name: Download Top Languages SVG
        run: |
          curl -L \
            -H "User-Agent: github-actions" \
            -H "Accept: image/svg+xml" \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=mr-vance&layout=donut-vertical&theme=transparent&langs_count=10" \
            -o assets/top-langs.svg

          # Validate that the response is actually an SVG
          if ! grep -q "<svg" assets/top-langs.svg; then
            echo "Stats API returned invalid file"
            exit 1
          fi

      - name: Commit updated stats
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add assets/top-langs.svg
          git commit -m "Update top languages stats" || echo "No changes to commit"
          git push
