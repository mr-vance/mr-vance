name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p assets

      - name: Download Top Languages SVG
        run: |
          curl -L "https://github-readme-stats.vercel.app/api/top-langs/?username=mr-vance&layout=donut-vertical&theme=transparent&langs_count=10" -o assets/top-langs.svg

      - name: Commit stats
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add assets/top-langs.svg
          git commit -m "Update top languages stats" || echo "No changes"
          git push